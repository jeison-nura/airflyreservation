[project]
name = "flight-booking-backend"
version = "0.1.0"
description = "Modular monolith backend for the flight booking MVP"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1.0",
    "celery[redis]>=5.6,<6.0",
    "fastapi>=0.135,<1.0",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.41,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1.0",
    "alembic>=1.15,<2.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_booking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
