services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flight_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flight_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-worker:
    build: .
    image: flight-booking-inventory-worker:local
    command:
      - celery
      - -A
      - flight_booking.modules.inventory.adapters.worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=inventory
      - --pool=solo
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:local-dev-only@postgres:5432/flight_booking
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  inventory-beat:
    build: .
    image: flight-booking-inventory-worker:local
    command:
      - celery
      - -A
      - flight_booking.modules.inventory.adapters.worker.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/inventory-celerybeat-schedule
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      inventory-worker:
        condition: service_started
    restart: unless-stopped

  reservations-worker:
    build: .
    image: flight-booking-reservations-worker:local
    command:
      - celery
      - -A
      - flight_booking.modules.reservations.adapters.worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=reservations
      - --pool=solo
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:local-dev-only@postgres:5432/flight_booking
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reservations-beat:
    build: .
    image: flight-booking-reservations-worker:local
    command:
      - celery
      - -A
      - flight_booking.modules.reservations.adapters.worker.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/reservations-celerybeat-schedule
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      reservations-worker:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
